{% extends "base.html" %}

{% block title %}Login • Fundoo Notes{% endblock %}

{% block content %}
  <section class="max-w-md mx-auto">
    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
      <h1 class="text-2xl font-semibold">Login</h1>
      <p class="text-sm text-slate-600 mt-1">Enter your credentials to access your notes.</p>

      <form method="POST" class="mt-6 space-y-4">
        {% csrf_token %}

        <div>
          <label class="block text-sm font-medium text-slate-700">Username</label>
          <input
            class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-300"
            type="text"
            name="username"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Password</label>
          <input
            class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-300"
            type="password"
            name="password"
            required
          />
        </div>

        <button class="w-full rounded-full px-5 py-2 font-semibold bg-amber-200 hover:bg-amber-300 transition border border-amber-300" type="submit">Login</button>
      </form>

      <div class="mt-5 text-sm text-slate-600">
        New here?
        <a class="font-medium text-slate-900 hover:underline" href="{% url 'register' %}">Create an account</a>
      </div>
    </div>
  </section>
{% endblock %}
