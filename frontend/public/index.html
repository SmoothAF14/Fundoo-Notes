<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="Fundoo Notes — capture, organize and share your notes." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Design tokens (single source of truth for colors and type).
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'sans-serif'],
            },
            colors: {
              primary: { DEFAULT: '#2563EB', hover: '#1D4ED8', soft: '#EFF6FF' },
              accent: { DEFAULT: '#EA580C', soft: '#FFF7ED' },
              ink: '#1E293B',
              subtle: '#475569',
              faint: '#94A3B8',
              line: '#E2E8F0',
              muted: '#F1F5F9',
              canvas: '#F8FAFC',
              danger: { DEFAULT: '#DC2626', soft: '#FEF2F2' },
              success: { DEFAULT: '#059669', soft: '#ECFDF5' },
            },
            boxShadow: {
              card: '0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06)',
              lift: '0 10px 30px -12px rgba(15, 23, 42, 0.18)',
            },
          },
        },
      };
    </script>
    <title>Fundoo Notes</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
